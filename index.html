<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xüsusi Dəvətnamə</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,400&family=Montserrat:wght@300;400;600;700&family=Cinzel:wght@600;700;800&family=Great+Vibes&display=swap" rel="stylesheet">
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        gold: {
                            100: '#FFF5D1',
                            300: '#F7D070',
                            400: '#E5B842',
                            500: '#D4AF37',
                            600: '#AA8C2C',
                            700: '#7E661B'
                        },
                        ruby: {
                            800: '#58000C',
                            900: '#3A0007',
                            950: '#220004',
                            bright: '#D62828'
                        }
                    },
                    fontFamily: {
                        serif: ['Playfair Display', 'serif'],
                        sans: ['Montserrat', 'sans-serif'],
                        cinzel: ['Cinzel', 'serif'],
                        script: ['Great Vibes', 'cursive']
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background: radial-gradient(circle at 50% 50%, #4a0209 0%, #1e0004 70%, #0f0002 100%);
            color: #FFF5D1;
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Gold Gradient Texts & Borders */
        .gold-text {
            background: linear-gradient(135deg, #FFF5D1 0%, #F7D070 40%, #D4AF37 70%, #AA8C2C 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .gold-glow {
            box-shadow: 0 0 25px rgba(212, 175, 55, 0.35);
        }

        /* 3D Gatefold Container */
        .gate-viewport {
            perspective: 1400px;
        }

        .gate-container {
            position: relative;
            transform-style: preserve-3d;
        }

        /* Gatefold Doors (Left & Right) */
        .gate-door {
            transition: transform 1.2s cubic-bezier(0.77, 0, 0.175, 1);
            transform-style: preserve-3d;
            backface-visibility: hidden;
        }

        .gate-door-left {
            transform-origin: left center;
            background: linear-gradient(135deg, #60000d 0%, #3a0007 100%);
            border-right: 2px solid #D4AF37;
        }

        .gate-door-right {
            transform-origin: right center;
            background: linear-gradient(225deg, #60000d 0%, #3a0007 100%);
            border-left: 2px solid #D4AF37;
        }

        /* Opened State for Doors */
        .gate-container.open .gate-door-left {
            transform: rotateY(-130deg);
        }

        .gate-container.open .gate-door-right {
            transform: rotateY(130deg);
        }

        /* Center Crest / Seal */
        .center-seal {
            transition: opacity 0.4s ease, transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .gate-container.open .center-seal {
            opacity: 0;
            transform: translate(-50%, -50%) scale(0.2);
            pointer-events: none;
        }

        /* Gold Frame Pattern */
        .gold-pattern-border {
            border: 2px solid transparent;
            border-image: linear-gradient(to bottom right, #F7D070, #58000C, #D4AF37) 1;
        }

        /* Sparkle floating animation */
        .sparkle {
            position: absolute;
            background: radial-gradient(circle, #FFF5D1 0%, #D4AF37 70%, transparent 100%);
            border-radius: 50%;
            pointer-events: none;
            opacity: 0;
            animation: floatUp 4s infinite ease-in-out;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) scale(0.5); opacity: 0; }
            50% { opacity: 0.8; }
            100% { transform: translateY(-120px) scale(1.2); opacity: 0; }
        }
    </style>
</head>
<body class="flex flex-col items-center justify-between min-h-screen p-4 md:p-8 relative">

    <!-- Sparkles Layer -->
    <div id="sparkles-container" class="absolute inset-0 overflow-hidden pointer-events-none z-0">
